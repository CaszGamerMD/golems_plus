name: Scaffold Bridge AI — Physical Training Tests
on:
  push:
    branches: [feature/scaffold-bridge-planning-262]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Evaluate general scaffold planning rules
        run: gradle --no-daemon test
      - name: Real entity bridge placement and safe return to ground
        run: gradle --no-daemon runGameTest
      - name: Preserve physical proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-bridge-training-physical
          path: |
            build/reports/
            build/test-results/
            build/run/gameTest/logs/
          if-no-files-found: ignore
