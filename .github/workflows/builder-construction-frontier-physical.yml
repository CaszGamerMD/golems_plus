name: Builder Construction Frontier Planner — Fabric 26.2
run-name: "Prevalidated work stances / shared Y / physical movement"
on:
  push:
    branches: [feature/builder-construction-frontier-planner-262]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Compile and run unit tests
        run: gradle --no-daemon test
      - name: Run all physical Builder GameTests including frontier planning
        run: gradle --no-daemon runGameTest
      - name: Save diagnostic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-frontier-physical-tests
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
