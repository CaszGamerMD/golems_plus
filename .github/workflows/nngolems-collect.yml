name: NNGolems controlled data and evaluation
on:
  push:
    branches: [NNGolems]
    paths:
      - '.github/workflows/nngolems-collect.yml'
      - 'scripts/nngolems/**'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderNeuralRecorder.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    env:
      GOLEMS_NN_RECORD: 'true'
      GOLEMS_BUILDER_SCAFFOLDING: 'false'
      MATRIX_TEST_MODE: controlled
      MATRIX_ASSESSMENT_SECONDS: '300'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify source fixture and isolate Matrix assessment
        run: |
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          root=Path('src/gametest/resources/golems_plus_matrix')
          data=base64.b64decode(''.join((root/f'segment{i}.txt').read_text().strip() for i in range(4)),validate=True)
          assert hashlib.sha256(data).hexdigest()=='77fa9731b11b1b666034a9e155c5a56abc173b9f9a974f963f916d7ef7d11816'
          p=Path('src/gametest/resources/fabric.mod.json')
          d=json.loads(p.read_text())
          d['entrypoints']['fabric-gametest']=['com.caszgamermd.golemsplus.builder.BuilderVillagerMatrixAssessmentGameTest']
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Collect real movement observations
        shell: bash
        run: |
          mkdir -p build/nn-data
          set +e
          set -o pipefail
          gradle --no-daemon runGameTest 2>&1 | tee build/nn-data/server.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > build/nn-data/gradle-exit.txt
          # A natural navigation stall is useful data, but a crash or incomplete fixture is not.
          grep -Fq '[MATRIX FULL IMPORT PASS] 15376' build/nn-data/server.log
          grep -Fq '[MATRIX CONTROLLED ENV]' build/nn-data/server.log
          grep -Fq '[MATRIX TRIAL RESULT]' build/nn-data/server.log
          python3 scripts/nngolems/collect.py build/nn-data/server.log build/nn-data --commit "$GITHUB_SHA" --trial '${{ matrix.trial }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nn-trial-${{ matrix.trial }}
          path: build/nn-data/
          if-no-files-found: error
  evaluate:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nn-trial-*
          path: build/nn-data
      - name: Train and evaluate by independent server run
        run: |
          python3 -m unittest discover -s scripts/nngolems -p 'test_*.py'
          python3 scripts/nngolems/train.py build/nn-data/nn-trial-*/samples.log --output build/nn-evaluation --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: nn-evaluation
          path: build/nn-evaluation/
