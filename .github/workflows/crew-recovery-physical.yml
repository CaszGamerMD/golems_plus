name: Physical crew retreat barrier
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderCrewRecovery.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderEscapeBox.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderMultiLegTravel.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderFlight.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderCrewRecoveryGameTest.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderHighEscapeGameTest.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderMultiLegTravelGameTest.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderSameHeightDetourGameTest.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderDynamicRouteRepairGameTest.java'
      - '.github/workflows/crew-recovery-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: BuilderCrewRecoveryGameTest
            marker: '[CREW RETREAT BARRIER PASS]'
          - fixture: BuilderHighEscapeGameTest
            marker: '[ESCAPE THREE STAGES PASS]'
          - fixture: BuilderMultiLegTravelGameTest
            marker: '[MULTI FLIGHT PASS]'
          - fixture: BuilderSameHeightDetourGameTest
            marker: '[MULTI DETOUR PASS]'
          - fixture: BuilderDynamicRouteRepairGameTest
            marker: '[MULTI REPAIR PASS]'
    env:
      GOLEMS_BUILDER_SCAFFOLDING: 'false'
      GOLEMS_BUILDER_TRACE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Run isolated physical crew recovery
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          d=json.loads(p.read_text())
          d['entrypoints']['fabric-gametest']=['com.caszgamermd.golemsplus.builder.${{ matrix.fixture }}']
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          set -o pipefail
          gradle --no-daemon runGameTest 2>&1 | tee "$RUNNER_TEMP/crew-recovery.log"
          grep -F '${{ matrix.marker }}' "$RUNNER_TEMP/crew-recovery.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crew-recovery-log-${{ matrix.fixture }}
          path: ${{ runner.temp }}/crew-recovery.log
