name: NNGolems structure lookahead validation
on:
  push:
    branches: [NNGolems]
    paths:
      - '.github/workflows/nngolems-structure-lookahead.yml'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderNNStructures.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - run: gradle --no-daemon test --tests '*BuilderNNStructuresTest' --tests '*BuilderZoneWorkPlanTest' --tests '*BuilderNNStrategyAdvisorTest'
