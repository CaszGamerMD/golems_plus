name: NNGolems flight shadow benchmark
on:
  push:
    branches: [NNGolems]
    paths:
      - '.github/workflows/nngolems-shadow.yml'
      - 'scripts/nngolems/shadow_report.py'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderNeuralAdvisor.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderFlight.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderNeuralRecorder.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderNNCurriculumGameTest.java'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        course: [home, dragon]
        trial: [1, 2, 3]
    env:
      NN_COURSE: ${{ matrix.course }}
      NN_COURSE_SECONDS: '300'
      NN_SPEED_TEST: 'true'
      GOLEMS_NN_SHADOW: 'true'
      GOLEMS_NN_MODEL: ${{ github.workspace }}/build/frozen-model/flight_environment-model.json
      NN_SPEED_TICK_LIMIT: '72000'
      GOLEMS_NN_RECORD: 'true'
      GOLEMS_BUILDER_SCAFFOLDING: 'false'
      MATRIX_TEST_MODE: controlled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Retrieve frozen trained flight model
        uses: actions/download-artifact@v4
        with:
          name: nn-cross-build-models
          path: build/frozen-model
          run-id: 43833585125
          github-token: ${{ github.token }}
      - name: Verify source and isolate physical course
        run: |
          python3 scripts/nngolems/prepare_curriculum.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          d=json.loads(p.read_text())
          d['entrypoints']['fabric-gametest']=['com.caszgamermd.golemsplus.builder.BuilderNNCurriculumGameTest']
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Run speed assessment
        shell: bash
        run: |
          mkdir -p build/nn-speed
          set +e
          set -o pipefail
          gradle --no-daemon runGameTest 2>&1 | tee build/nn-speed/server.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > build/nn-speed/gradle-exit.txt
          test "$status" = 0
          python3 scripts/nngolems/collect_curriculum.py build/nn-speed/server.log build/nn-speed --course "$NN_COURSE" --commit "$GITHUB_SHA"
          grep -Fq '[NN_SPEED_RESULT]' build/nn-speed/server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nn-shadow-${{ matrix.course }}-${{ matrix.trial }}
          path: build/nn-speed/
          if-no-files-found: error
  summarize:
    needs: speed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nn-shadow-*
          path: build/speed-data
      - name: Report repeatable game-tick benchmark
        run: |
          python3 -m unittest discover -s scripts/nngolems -p 'test_*.py'
          python3 scripts/nngolems/shadow_report.py build/speed-data --output build/speed-results/shadow-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nn-shadow-report
          path: build/speed-results/
