name: Dome — Planned Scaffold Ascent and Safe Return
on:
  push:
    branches: [test/dome-planned-scaffold-route-262]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-dome:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Physical 3,537-block original user Dome and scaffold route tests
        run: gradle --no-daemon runGameTest
      - name: Save Dome diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-dome-planned-scaffold-access
          path: |
            build/gametest/
            build/reports/
            build/run/gameTest/logs/
          if-no-files-found: ignore
