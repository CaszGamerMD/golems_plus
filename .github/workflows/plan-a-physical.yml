name: Plan A — Real Scaffold Tower and Bridge Training
on:
  push:
    branches: [feature/plan-a-three-axis-scaffold-bridge-262]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Actual 26.2 Minecraft scaffold and obstacle GameTests
        run: gradle --no-daemon runGameTest
      - name: Java rule unit tests
        run: gradle --no-daemon test
      - name: Preserve physical test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-a-physical-evidence
          path: |
            build/reports/
            build/test-results/
            build/run/gameTest/logs/
          if-no-files-found: ignore
