name: Enhanced Scaffolding physical placement tests
on:
  push:
    branches: [experiment/builder-dome-starter-toolkit-262]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enhanced-scaffolding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Run only enhanced scaffolding physical GameTests
        run: |
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
              'com.caszgamermd.golemsplus.builder.EnhancedScaffoldingGameTest'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PYTEST
          gradle --no-daemon runGameTest
      - name: Preserve physical test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-scaffolding-physical-results
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
