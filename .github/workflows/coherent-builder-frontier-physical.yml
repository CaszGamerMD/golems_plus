name: Coherent Builder frontier physical tests
on:
  push:
    branches: [experiment/builder-dome-starter-toolkit-262]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connected-front:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Run construction-front physical GameTests
        run: |
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
              'com.caszgamermd.golemsplus.builder.BuilderConstructionFrontierGameTest'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PYTEST
          gradle --no-daemon runGameTest
      - name: Save frontier diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherent-frontier-test-results
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
