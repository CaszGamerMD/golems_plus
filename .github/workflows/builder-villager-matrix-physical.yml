name: Villager Matrix — required physical foundation / four Builder Golems
on:
  push:
    branches: [main, feat/builder-rally-point-recovery]
    paths:
      - 'src/main/java/com/caszgamermd/golemsplus/builder/**'
      - 'src/main/java/com/caszgamermd/golemsplus/worker/**'
      - 'src/main/java/com/caszgamermd/golemsplus/world/WorkerStationBlockEntity.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderVillagerMatrixStartGameTest.java'
      - 'src/gametest/resources/**'
      - 'src/test/java/com/caszgamermd/golemsplus/builder/**'
      - '.github/workflows/builder-villager-matrix-physical.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  floating-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify all Builder unit tests before physical Matrix construction
        run: gradle --no-daemon test compileGametestJava
      - name: Build all 27 real Matrix foundation cells with four physical Builders
        shell: bash
        run: |
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
              'com.caszgamermd.golemsplus.builder.BuilderVillagerMatrixStartGameTest'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PYTEST
          set -euo pipefail
          mkdir -p build/matrix-traces
          # Different GameTest launches randomize builder positions/timing.
          # An occasional 27/27 success must not hide frequent 24/27
          # deadlocks. Require three independent, complete physical runs.
          for attempt in 1 2 3; do
            log="build/matrix-traces/physical-run-${attempt}.log"
            echo "::group::Villager Matrix foundation physical run ${attempt}/3"
            gradle --no-daemon runGameTest 2>&1 | tee "$log"
            grep -E '\[MATRIX (ARENA|START|PROGRESS|MISSING)' "$log" || true
            if ! grep -Fq '[MATRIX START PASS] 27' "$log"; then
              echo "::error::Matrix foundation incomplete on physical run ${attempt}/3"
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Save Matrix build trace and Minecraft GameTest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: villager-matrix-foundation-trace
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
            build/matrix-traces/
