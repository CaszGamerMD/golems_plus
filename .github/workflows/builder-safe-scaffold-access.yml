name: Physical Scaffold Access and Safe Descent
on:
  push:
    branches: [feature/builder-scaffold-ascent-descent-262]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-entities:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Unit tests for scaffold choices and multi-stage vertical movement
        run: gradle --no-daemon test
      - name: Four physical phases - build climb descend dismount without jumps
        run: gradle --no-daemon runGameTest
      - name: Preserve Minecraft proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-builder-scaffold-ascent-and-descent
          path: |
            build/reports/
            build/test-results/
            build/run/gameTest/logs/
          if-no-files-found: ignore
