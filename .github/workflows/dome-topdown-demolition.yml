name: Physical dome top-down demolition GameTest

on:
  push:
    branches:
      - test/dome-summit-roundtrip-262
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dome-demolition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Isolate full demolition fixture from other GameTests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("src/gametest/resources/fabric.mod.json")
          data = json.loads(path.read_text())
          data["entrypoints"]["fabric-gametest"] = [
              "com.caszgamermd.golemsplus.builder.DomeReverseDemolitionGameTest"
          ]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Run actual full-size top-down demolition in Minecraft
        run: gradle --no-daemon runGameTest
      - name: Preserve physical paths, mined-block events and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dome-topdown-demolition-traces
          if-no-files-found: warn
          path: |
            build/run/gameTest/logs/
            build/gametest/
            build/test-results/
            build/reports/
