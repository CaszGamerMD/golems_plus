name: Physical propeller terrain hover
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderFlight.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderPropellerGameTest.java'
      - '.github/workflows/propeller-terrain-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terrain-hover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Run physical propeller tests
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(path.read_text())
          data['entrypoints']['fabric-gametest']=['com.caszgamermd.golemsplus.builder.BuilderPropellerGameTest']
          path.write_text(json.dumps(data,indent=2)+'\n')
          PY
          set -o pipefail
          gradle --no-daemon runGameTest 2>&1 | tee "$RUNNER_TEMP/propeller-terrain.log"
          grep -F '[LOW TERRAIN HOVER PASS]' "$RUNNER_TEMP/propeller-terrain.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: propeller-terrain-log
          path: ${{ runner.temp }}/propeller-terrain.log
