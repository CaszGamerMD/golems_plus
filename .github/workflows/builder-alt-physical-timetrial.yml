name: 11.2s goal on real alt track — 9 real Builder Golems, three parent families
# Normal CI performs REAL individual evolution; matched local-rule comparisons are opt-in.

on:
  push:
    branches:
      - feature/builder-evolutionary-alt-course-262
    paths:
      - src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderEvolutionAltCourseGameTest.java
      - src/gametest/java/com/caszgamermd/golemsplus/builder/NavigationStrategyMemory.java
      - src/gametest/java/com/caszgamermd/golemsplus/builder/NavigationRuleMemory.java
      - src/gametest/java/com/caszgamermd/golemsplus/builder/NavigationRightOfWay.java
      - src/main/java/com/caszgamermd/golemsplus/builder/BuilderChunkTickets.java
      - scripts/tests/test_navigation_local_rules.py
      - scripts/tests/test_navigation_strategy_memory.py
      - scripts/report_alt_physical_results.py
      - scripts/tests/test_report_alt_physical_results.py
      - scripts/merge_alt_nine_state.py
      - scripts/tests/test_merge_alt_nine_state.py
      - scripts/export_alt_nine_mobile.py
      - scripts/tests/test_export_alt_nine_mobile.py
      - scripts/report_alt_nine_results.py
      - scripts/tests/test_report_alt_nine_results.py
      - scripts/tests/test_alt_genetic_selection.py
      - .github/workflows/builder-alt-physical-timetrial.yml
      - scripts/export_alt_mobile_replays.py
      - scripts/tests/test_export_alt_mobile_replays.py
      - training/alt/replays/mobile-template.html
  workflow_dispatch:
    inputs:
      mode:
        description: "Physical golem training mode (evolve learns, consistency freezes, validate checks historic cohort)"
        type: choice
        options:
          - evolve
          - consistency
          - validate
        default: evolve

permissions:
  contents: write

# Serialize checkpoint writers so one Minecraft run cannot overwrite
# another run's genetically learned progress.
concurrency:
  group: physical-evolution-checkpoint-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  real-minecraft-physics:
    runs-on: ubuntu-latest
    env:
      TRAINING_BRANCH: ${{ github.head_ref || github.ref_name }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Test gene persistence and no-regression champion merging
        run: |
          python3 -m unittest discover -s scripts/tests -p test_alt_genetic_selection.py -v
          python3 -m unittest discover -s scripts/tests -p test_navigation_strategy_memory.py -v
          python3 -m unittest discover -s scripts/tests -p test_navigation_local_rules.py -v
          python3 -m unittest discover -s scripts/tests -p test_merge_real_evolution_state.py -v
          python3 -m unittest discover -s scripts/tests -p test_merge_alt_evolution_state.py -v
          python3 -m unittest discover -s scripts/tests -p test_export_real_evolution_replays.py -v
          python3 -m unittest discover -s scripts/tests -p test_export_alt_mobile_replays.py -v
          python3 -m unittest discover -s scripts/tests -p test_export_alt_bounded_replays.py -v
          python3 -m unittest discover -s scripts/tests -p test_report_alt_physical_results.py -v
          python3 -m unittest discover -s scripts/tests -p test_export_alt_nine_mobile.py -v
          python3 -m unittest discover -s scripts/tests -p test_report_alt_nine_results.py -v
          python3 -m unittest discover -s scripts/tests -p test_merge_alt_nine_state.py -v
      - name: Isolate the real-entity training course from other GameTest arenas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          manifest=json.loads(p.read_text())
          required='com.caszgamermd.golemsplus.builder.BuilderEvolutionAltCourseGameTest'
          # Dedicated world: this one job runs the actual course alone.
          # The standard build independently runs the normal regression
          # GameTests. Every scored evolution still uses live entities.
          manifest['entrypoints']['fabric-gametest']=[required]
          p.write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Verify 9 real BuilderGolem entrants and three parent families
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('src/gametest/resources/fabric.mod.json').read_text())
          required='com.caszgamermd.golemsplus.builder.BuilderEvolutionAltCourseGameTest'
          assert manifest['entrypoints']['fabric-gametest'] == [required], (
              'A physical evolution run must own an isolated Minecraft GameTest arena')
          test=Path('src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderEvolutionAltCourseGameTest.java').read_text()
          assert 'new BuilderGolem(' in test
          assert 'private static final int DEADLINE=260;' in test
          assert 'SELECTED_BOTS.length!=9' in test
          assert 'breedFamilies(knowledgePool,rng,SELECTED_BOTS.length)' in test
          assert 'if(winners.size()!=3||size!=9)' in test
          assert 'for(int clone=0;clone<2;clone++)' in test
          assert 'obj.add("nextStrategies"' in test
          assert 'inheritedRouteLegal(' in test
          assert '0,2,4,6,8,11,13,15,17,19' in test
          assert 'if(finished==bots.size()){' in test
          assert 'helper.succeed();return;' in test
          assert 'Physical evolution did not qualify all 9' in test
          assert 'private static final int SPEED_TARGET_TICKS=224;' in test
          assert 'finish11_2s=' in test
          assert 'StrategyPlan plan=chooseStrategy(start[0],start[1],genome,' in test
          assert 'realBuilderPlannerDiscoversOpenBirchDoor' in test
          assert 'doorPlans=' in test
          assert 'doorCrossings=' in test
          assert 'Genome.cross(a,b,rng).mutate(rng)' in test
          assert 'spawnGeneration(helper,generationGenes,collisionMemory,' in test
          assert 'realBlockFailures' in test
          assert 'planRoute(' in test
          assert 'walkOneTick(helper,b,bots)' in test
          assert 'coordinateTraffic(b,crew,vx,vz)' in test
          assert 'remainingPathMeters' in test
          assert 'realBuildersQueueWithoutShoving' in test
          assert 'self.yieldingTicks>=4' not in test
          assert 'recoverCongestedRoute(helper,b,crew)' in test
          assert 'realBuildersYieldBeforePhysicalLaneMerge' in test
          assert 'slabEntryReservations' in test
          assert 'teammateWithin(b,crew,1.15)' in test
          assert 'trafficRecoveryTicks' in test
          assert 'ordered.sort(Comparator' in test
          assert 'physicalCellOpen(helper,world,mob,x,z)' in test
          assert 'realControllerWalksEntireWideSlabFieldOffCenter' in test
          assert 'realControllerWalksOuterSlabLaneWithoutCornerClipping' in test
          assert 'boolean nativeSlabAscent=cardinalApproach' in test
          assert 'b.successfulSlabAscents++' in test
          assert 'slabEntryStalls' in test
          assert 'realBuilderRejectsLowCeilingSlabButCanUseOpenHalfSlab' in test
          assert 'realBuilderCrossesExistingSingleOpenBirchDoor' in test
          assert 'realBuilderOpensClosedDoorAndWalksThrough' in test
          assert 'realControllerEntersDoorOffCenterWithoutJumping' in test
          assert 'int doorEntryAlignTicks,doorEntryStalls' in test
          assert '&&!enteringDoorCell&&!leavingDoorCell' in test
          assert 'openDoorFromReach(world,mob,target)' in test
          assert 'updateKnowledgePool(this,b)' in test
          assert 'knowledgePool.clear();' in test
          assert 'obj.add("knowledgePool",pool)' in test
          assert 'genes.set(slot,parent.dna());' in test
          assert 'generationStrategies=new ArrayList<>(families.policies())' in test
          assert 'strategyMemory,strategyValidation' in test
          assert 'strategyMemory.observe(new NavigationStrategyMemory.Observation(' in test
          assert 'checkpoint.has("strategyMemory")' in test
          assert 'checkpoint.has("localRuleMemory")' in test
          assert 'realBuilderUsesClearHoldingSpace' in test
          assert 'realBuilderCentersAtSlabCorner' in test
          assert 'realBuildersReceiveNativeTicksAcrossCourse' in test
          assert 'Incomplete native entity simulation' in test
          assert 'ruleMemory.observe(new NavigationRuleMemory.Trial(' in test
          # Stepping up 0.5 blocks needs the native downward ground
          # probe; the old check incorrectly required zero vertical
          # movement and would reject the already-tested slab fix.
          assert 'double nativeGroundProbe=grounded' in test
          assert 'mob.move(MoverType.SELF,new Vec3(vx,nativeGroundProbe,vz))' in test
          print('Physical family evolution gate: 9 live Builder Golems, three unchanged parents and 6 physical mutations')
          PY
      - name: Mandatory 260-tick real Minecraft golem trial
        shell: bash
        env:
          GOLEMS_EVOLUTION_STATE_DIR: ${{ github.workspace }}/training/alt/state-nine
          GOLEMS_EVOLUTION_REPLAY_DIR: ${{ github.workspace }}/training/alt/replays/live-nine
          GOLEMS_EVOLUTION_MODE: ${{ github.event.inputs.mode || 'evolve' }}
        run: |
          set -o pipefail
          mkdir -p build/timetrial-training training/alt/replays/live-nine training/alt/state-nine
          echo "Physical training mode: ${GOLEMS_EVOLUTION_MODE}"
          # Capture baseline to prove we saved NEW physical observations,
          # not merely copied another non-learning checkpoint unchanged.
          python3 - <<'PY'
          import json
          from pathlib import Path
          state_path=Path('training/alt/state-nine/checkpoint.json')
          state=json.loads(state_path.read_text()) if state_path.exists() else {}
          Path('build/timetrial-training/original-state.json').write_text(
              json.dumps({
                  'completedGenerations': state.get('completedGenerations',0),
                  'strategyObservations': len(state.get('strategyMemory',{}).get('observations',[])),
                  'personalScores': state.get('personalScores', []),
                  'knowledgePool': state.get('knowledgePool', [])
              }))
          PY
          failures=0
          for trial in 1 2 3; do
            echo "::group::Real physical Minecraft trial ${trial}/3"
            export GOLEMS_EVOLUTION_SESSION="${GITHUB_RUN_ID:-local}-${trial}"
            echo "Trial ${trial}: resuming persisted DNA from previous trial"
            if gradle --no-daemon runGameTest 2>&1 | tee "build/timetrial-training/real-builder-trial-${trial}.log"; then
              echo "PHYSICAL TRIAL ${trial}: Minecraft GameTest passed"
            else
              echo "PHYSICAL TRIAL ${trial}: Minecraft GameTest failed; keeping learned DNA"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          echo "Completed 3 physical trials; failures=${failures}"
          # Even when 10/10 fails, a LEARNING run must have scored and
          # persisted actual gene generations and strategy outcomes.
          if [[ "${GOLEMS_EVOLUTION_MODE}" == evolve ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/timetrial-training')
          original=json.loads((root/'original-state.json').read_text())
          latest=json.loads(Path('training/alt/state-nine/checkpoint.json').read_text())
          assert latest['completedGenerations'] > original['completedGenerations'], (
              'Training did not advance physical generations')
          assert len(latest['strategyMemory']['observations']) > original['strategyObservations'], (
              'Training did not collect independent physical strategy episodes')
          assert 1 <= len(latest['knowledgePool']) <= 3
          assert len(latest['nextPopulation']) == 9
          assert len(latest['knowledgePool']) == 3
          assert latest['familyModel'] == 'three-parents-two-mutated-children-v1'
          from collections import Counter
          assert sorted(Counter(latest['nextFamilyOrigins']).values()) == [3,3,3]
          assert any('[ALT INDEPENDENT LEARNING]' in log.read_text()
                     for log in root.glob('real-builder-trial-*.log')), (
                         'Frozen consistency mode accidentally ran instead of evolution')
          print('Verified genuine physical evolution: generations:',
                original['completedGenerations'], '->', latest['completedGenerations'],
                '; strategy observations:',
                original['strategyObservations'], '->',
                len(latest['strategyMemory']['observations']))
          PY
          fi
          exit "${failures}"
      - name: Report physical results and prioritized improvements
        if: always()
        shell: bash
        env:
          GOLEMS_EVOLUTION_MODE: ${{ github.event.inputs.mode || 'evolve' }}
        run: |
          python3 scripts/report_alt_nine_results.py \
            --run-id "${GITHUB_RUN_ID}" \
            --out training/alt/reports/latest.md \
            --json-out training/alt/reports/latest.json
      - name: Build bounded 3-bundle replay viewers from real physical traces
        if: always()
        shell: bash
        run: |
          if compgen -G 'training/alt/replays/live-nine/trial-*-generation-*.json' > /dev/null; then
            python3 scripts/export_alt_nine_mobile.py --batches 3
          else
            echo 'No scored nine-golem physical generations yet; viewer still shows archived tests.'
            exit 0
          fi
          # Both phone and desktop addresses use the same compact viewer.
          # Never embed the raw 90+ MiB historical replay archive again.
          cp training/alt/replays/mobile-viewer.html training/alt/replays/route-viewer.html
      - name: Commit learned real-entity genes, EVEN IF the trial fails
        if: always() && (github.head_ref == 'feature/builder-evolutionary-alt-course-262' || github.ref == 'refs/heads/feature/builder-evolutionary-alt-course-262') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          if [[ ! -s training/alt/state-nine/checkpoint.json ]]; then
            echo 'No new real-entity checkpoint was produced.'
            exit 0
          fi
          git config user.name 'golems-evolution[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Protect new genetic improvements from stale CI checkouts:
          # merge results with LATEST remote champion/state before commit.
          local_state="$(mktemp -d)"
          cp -a training/alt/state-nine/. "$local_state/"
          replay_backup="$(mktemp -d)"
          if [[ -d training/alt/replays/live-nine ]]; then
            cp -a training/alt/replays/live-nine/. "$replay_backup/"
          fi
          report_backup="$(mktemp -d)"
          if [[ -f training/alt/reports/latest.md && -f training/alt/reports/latest.json ]]; then
            cp training/alt/reports/latest.md training/alt/reports/latest.json "$report_backup/"
          fi
          # Viewer outputs are rebuilt AFTER merging against latest
          # remote traces, so stale local data cannot replace new bundles.
          # The GameTest workflow temporarily edits its Fabric test
          # manifest, and training edits tracked checkpoint files.
          # Reset this disposable checkout AFTER copying new learning.
          rm -rf training/alt/state-nine
          # A newer training job may already have committed reports at
          # these paths. Their untracked local copies otherwise abort
          # git checkout BEFORE checkpoint merge, losing all new DNA.
          # Backups above preserve this run's independently scored report.
          rm -f training/alt/reports/latest.md training/alt/reports/latest.json
          git reset --hard HEAD
          for attempt in 1 2 3; do
            git fetch origin "${TRAINING_BRANCH}"
            git checkout -B physical-training-publish "origin/${TRAINING_BRANCH}"
            python3 scripts/merge_alt_nine_state.py "$local_state" training/alt/state-nine
            mkdir -p training/alt/replays/live-nine
            cp -an "$replay_backup/." training/alt/replays/live-nine/
            mkdir -p training/alt/reports/
            if [[ -f "$report_backup/latest.md" && -f "$report_backup/latest.json" ]]; then
              cp "$report_backup/latest.md" "$report_backup/latest.json" training/alt/reports/
            fi
            # Publish exactly the latest THREE run bundles after merging,
            # with identical bounded HTML at the mobile and desktop links.
            if compgen -G 'training/alt/replays/live-nine/trial-*-generation-*.json' > /dev/null; then
              python3 scripts/export_alt_nine_mobile.py --batches 3
              cp training/alt/replays/mobile-viewer.html training/alt/replays/route-viewer.html
            fi
            git add -- training/alt/state-nine/ training/alt/replays/live-nine/ training/alt/reports/ training/alt/replays/mobile-viewer.html training/alt/replays/mobile-data.json training/alt/replays/route-viewer.html
            if git diff --cached --quiet; then
              echo 'No improved state over current remote.'
              exit 0
            fi
            git commit -m 'Preserve nine-worker three-parent breeding and physical navigation evidence [skip ci]'
            if git push origin HEAD:"${TRAINING_BRANCH}"; then
              echo 'Checkpoint, champion, and history are durable on GitHub.'
              exit 0
            fi
            echo "Remote updated concurrently; remerging fresh state (attempt $attempt)"
          done
          echo 'Failed to save learned state: refusing to claim persistence.'
          exit 1
      - name: Preserve movement collision and timeout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-13-second-physical-entity-diagnostics
          path: |
            training/alt/state-nine/
            build/timetrial-training/real-builder-trial-*.log
            training/alt/reports/
            training/alt/replays/live-nine/
            training/alt/replays/mobile-viewer.html
            training/alt/replays/route-viewer.html
            training/alt/replays/mobile-data.json
            build/gametest/
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 30
