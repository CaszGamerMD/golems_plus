name: Builder Matrix powered-rail vanilla physics diagnostic
on:
  push:
    branches: [feat/builder-rally-point-recovery]
    paths:
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderMatrixRailPhysicsGameTest.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderRailSlope.java'
      - '.github/workflows/builder-matrix-rail-physics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rail-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Compile diagnostic
        run: gradle --no-daemon compileGametestJava
      - name: Run physically placed powered-rail/jig experiment
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'com.caszgamermd.golemsplus.builder.BuilderMatrixRailPhysicsGameTest'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          set -o pipefail
          gradle --no-daemon runGameTest 2>&1 | tee rail-physics.log
          grep '\[MATRIX RAIL PHYSICS\]' rail-physics.log
      - name: Upload vanilla rail-physics trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-rail-physics-log
          if-no-files-found: ignore
          path: |
            rail-physics.log
            build/gametest/
            build/run/gameTest/logs/
