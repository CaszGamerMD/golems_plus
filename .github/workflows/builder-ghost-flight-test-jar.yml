name: Virtual Scaffold Flight Experimental JAR

on:
  push:
    branches:
      - feat/builder-virtual-flight-scaffold-path-262
  pull_request:

jobs:
  playable-test-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build remapped Minecraft Fabric 26.2 test jar
        run: gradle --no-daemon clean test assemble
      - name: Verify gameplay classes in remapped jar
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one playable remapped jar"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          unzip -Z1 "${jars[0]}" > "$RUNNER_TEMP/contents.txt"
          for file in fabric.mod.json com/caszgamermd/golemsplus/builder/BuilderScaffoldBridge.class com/caszgamermd/golemsplus/builder/BuilderGolem.class; do
            grep -Fxq "$file" "$RUNNER_TEMP/contents.txt" || { echo "Missing $file"; exit 1; }
          done
          mkdir -p package
          cp "${jars[0]}" package/golems-plus-ghost-flight-scaffold-26.2.jar
          (cd package && sha256sum *.jar > SHA256SUMS.txt)
      - name: Upload independent playable experimental JAR
        uses: actions/upload-artifact@v4
        with:
          name: golems-plus-ghost-flight-scaffold-26.2
          path: package/
          if-no-files-found: error
          retention-days: 30
      - name: Publish experimental direct-download prerelease
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="builder-ghost-flight-scaffold-26.2-test"
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Experimental Fabric 26.2 Golems Plus Builder creative-flight-guided
          physical scaffold route prototype. Simulates 3D flight corridors but
          walks over physically placed, real-item-funded, supported scaffolds.
          Requires Java 25 and Fabric.
          
          **Experimental test build.** The full Dome build is not yet known to
          finish; this compile/JUnit artifact is NOT full GameTest acceptance.
          Use in a backed-up world and remove older Golems Plus jars first.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" package/*.jar package/SHA256SUMS.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" package/*.jar package/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "Golems Plus: Virtual scaffold flight prototype (Fabric 26.2)" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
