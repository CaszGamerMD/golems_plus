name: Reverse Dome — One Physical Golem Demolition Study
on:
  push:
    branches: [test/dome-reverse-demolition-262]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reverse-dome:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify original prebuilt dome fixture and single physical demo
        run: |
          test -f src/gametest/resources/data/golems_plus_gametest/gametest/structure/dome_arena.snbt
          grep -q 'BuilderDomeFixture.unpack' src/gametest/java/com/caszgamermd/golemsplus/builder/DomeReverseDemolitionGameTest.java
      - name: Demolish original dome with one real 192-capacity golem
        run: gradle --no-daemon runGameTest
      - name: Save demolition movement trace and game reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-golem-reverse-dome-study
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
