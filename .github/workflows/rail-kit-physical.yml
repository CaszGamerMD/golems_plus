name: Physical ascending rail kit
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderSupplyInventory.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderBuildService.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderRailSlope.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderRailKitGameTest.java'
      - '.github/workflows/rail-kit-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rail-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Run isolated physical ascending rail regressions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(path.read_text())
          data['entrypoints']['fabric-gametest']=['com.caszgamermd.golemsplus.builder.BuilderRailKitGameTest']
          path.write_text(json.dumps(data,indent=2)+'\n')
          PY
          set -o pipefail
          gradle --no-daemon runGameTest 2>&1 | tee "$RUNNER_TEMP/rail-kit.log"
          grep -F '[RAIL KIT FULL PASS]' "$RUNNER_TEMP/rail-kit.log"
          grep -F '[BUILDER RAIL JIG JOB PASS]' "$RUNNER_TEMP/rail-kit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rail-kit-physical-log
          path: ${{ runner.temp }}/rail-kit.log
