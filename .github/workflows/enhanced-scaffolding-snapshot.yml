name: Enhanced Scaffolding snapshot build
on:
  push:
    branches:
      - fix/enhanced-scaffolding-player-controls-262
  workflow_dispatch:

jobs:
  scaffold-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Compile, unit test and package
        run: gradle --no-daemon clean test remapJar compileGametestJava
      - name: Minecraft Enhanced Scaffolding GameTests (focused)
        run: gradle --no-daemon runGameTest --args="--tests golems_plus_gametest:enhanced_scaffolding_game_test_*"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enhanced-scaffolding-test-reports
          path: |
            build/gametest/
            build/reports/
            build/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: golems-plus-enhanced-scaffolding-fixed
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish snapshot-only playable JAR
        if: success() && github.ref == 'refs/heads/fix/enhanced-scaffolding-player-controls-262'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected one playable JAR, got %s\n' "${#jars[@]}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/scaffold-release"
          cp "${jars[0]}" "$RUNNER_TEMP/scaffold-release/golems-plus-0.3.58-dev-enhanced-scaffolding-fixed.jar"
          (cd "$RUNNER_TEMP/scaffold-release" && sha256sum *.jar > SHA256SUMS.txt)
          tag="enhanced-scaffolding-fix-${GITHUB_SHA:0:12}"
          gh release create "$tag" "$RUNNER_TEMP/scaffold-release/"*.jar "$RUNNER_TEMP/scaffold-release/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Enhanced Scaffolding player controls fix" \
            --notes "Based on Builder snapshot 43a28d9. Fixes creative tab and pick-block item, smooth ladder-style climbing through the climbable tag, and a bottom floor that catches players. Includes the newer Builder snapshot features."
