name: Full Villager Matrix - 8 real Builders
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-villager-matrix-physical.yml'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderCrewSchedule.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderBuildService.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderBlockResolver.java'
      - 'src/main/java/com/caszgamermd/golemsplus/worker/WorkerNavigation.java'
      - 'src/test/java/com/caszgamermd/golemsplus/builder/BuilderCrewScheduleTest.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderVillagerMatrixFull*'
      - 'src/gametest/resources/golems_plus_matrix/**'
      - 'src/gametest/resources/data/golems_plus_gametest/gametest/structure/matrix_arena.snbt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify all four segments are the original user schematic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,gzip,struct
          directory=Path('src/gametest/resources/golems_plus_matrix')
          encoded=''.join((directory/f'segment{i}.txt').read_text().strip()
                          for i in range(4))
          data=base64.b64decode(encoded,validate=True)
          expected='77fa9731b11b1b666034a9e155c5a56abc173b9f9a974f963f916d7ef7d11816'
          assert len(data)==7906,(len(data),'bad fixture length')
          assert hashlib.sha256(data).hexdigest()==expected,'not original Matrix'
          assert len(gzip.decompress(data))==66863,'bad NBT decompression'
          print('PASS: original 7906-byte VillagerMatrixClean_V2.litematic verified')
          PY
      - name: Compile all physical GameTests and unit tests
        run: gradle --no-daemon test compileGametestJava
      - name: Run full Matrix import and real eight-Builder construction
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(path.read_text())
          data['entrypoints']['fabric-gametest']=[
              'com.caszgamermd.golemsplus.builder.BuilderVillagerMatrixFullGameTest'
          ]
          path.write_text(json.dumps(data,indent=2)+'\n')
          PY
          set -o pipefail
          gradle --no-daemon runGameTest 2>&1 | tee "$RUNNER_TEMP/full-villager-matrix.log"
          grep -E '\[MATRIX FULL (IMPORT|TARGET|PROGRESS|STALL|PASS)' "$RUNNER_TEMP/full-villager-matrix.log" || true
          if ! grep -Fq '[MATRIX FULL IMPORT PASS] 15376' "$RUNNER_TEMP/full-villager-matrix.log"; then
            echo '::error::Exact uploaded Matrix import regression failed.'
            exit 1
          fi
          if ! grep -Fq '[MATRIX FULL PASS] 15376/15376' "$RUNNER_TEMP/full-villager-matrix.log"; then
            echo '::error::Full 15376-block Matrix not physically complete: inspect trace.'
            exit 1
          fi
      - name: Preserve full-Matrix progress and stuck-worker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-villager-matrix-8-builder-trace
          if-no-files-found: ignore
          retention-days: 30
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
