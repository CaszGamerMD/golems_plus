name: Physical propeller recovery
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderFlight.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderMaterialNetwork.java'
      - 'src/main/java/com/caszgamermd/golemsplus/builder/BuilderScaffoldPlanA.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderPropellerRecoveryGameTest.java'
      - '.github/workflows/propeller-recovery-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Run isolated physical recovery
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(path.read_text())
          data['entrypoints']['fabric-gametest']=['com.caszgamermd.golemsplus.builder.BuilderPropellerRecoveryGameTest']
          path.write_text(json.dumps(data,indent=2)+'\n')
          PY
          set -o pipefail
          gradle --no-daemon runGameTest 2>&1 | tee "$RUNNER_TEMP/propeller-recovery.log"
          grep -F '[POWERED SCAFFOLD EXIT PASS]' "$RUNNER_TEMP/propeller-recovery.log"
          grep -F '[BULK LAYER STOCK PASS]' "$RUNNER_TEMP/propeller-recovery.log"
          grep -F '[CREW SURPLUS PASS]' "$RUNNER_TEMP/propeller-recovery.log"
          grep -F '[ROOF ASCENT PASS]' "$RUNNER_TEMP/propeller-recovery.log"
          grep -F '[FRACTIONAL TAKEOFF PASS]' "$RUNNER_TEMP/propeller-recovery.log"
          grep -F '[FRACTIONAL SLAB LANDING PASS]' "$RUNNER_TEMP/propeller-recovery.log"
          grep -F '[MATERIAL NETWORK HANDOFF PASS]' "$RUNNER_TEMP/propeller-recovery.log"
          grep -F '[MATERIAL NETWORK NO BOUNCE PASS]' "$RUNNER_TEMP/propeller-recovery.log"
          grep -F '[MATERIAL NETWORK RESUPPLY PASS]' "$RUNNER_TEMP/propeller-recovery.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: propeller-recovery-log
          path: ${{ runner.temp }}/propeller-recovery.log
