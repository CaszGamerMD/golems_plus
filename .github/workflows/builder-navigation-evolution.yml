name: Builder navigation evolution training (headless)

on:
  push:
    branches:
      - feature/builder-evolutionary-navigation-trainer-262
  pull_request:
    paths:
      - scripts/builder_nav_evolution.py
      - scripts/tests/test_builder_nav_evolution.py
      - training/**
      - .github/workflows/builder-navigation-evolution.yml

jobs:
  navigation-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify non-destructive ground-only navigation geometry and genetic determinism
        run: python3 -m unittest discover -s scripts/tests -p 'test_builder_nav_evolution.py' -v
      - name: Train on deterministic door corridor fixture
        run: |
          python3 scripts/builder_nav_evolution.py \
            training/examples/door_corridor.json \
            training/examples/deadend_maze.json \
            --population 16 --generations 8 --timeout 400 --target 130 \
            --seed 42 --elites 3 --out build/builder-training
      - name: Verify saved champion constraints and replay
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/builder-training/champion.json")
          d = json.loads(p.read_text())
          assert d["simulated_only"] is True
          assert d["format"] == "golems-plus-nav-genome-v1"
          assert d["physics"]["collision_width_blocks"] == 0.65
          assert d["physics"]["collision_height_blocks"] == 1.6
          assert d["physics"]["speed_m_per_s"] == 4.0
          assert not any(d["physics"][action]
                         for action in ("breaking", "scaffolding", "flying", "diagonal"))
          assert d["runs"] and d["runs"][0]["path"]
          assert all(run["ticks"] <= 400 for run in d["runs"])
          assert Path("build/builder-training/history.csv").is_file()
          print("Validated simulation-only champion and physical constraints")
          PY
      - name: Save trainer statistics, champion DNA and replays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-navigation-evolution-lab
          path: build/builder-training/
          if-no-files-found: ignore
          retention-days: 30
