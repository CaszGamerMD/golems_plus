name: Required - 10 actual Builder Golems in Minecraft (18s)

on:
  push:
    branches:
      - feature/builder-evolutionary-navigation-trainer-262
  pull_request:
    paths:
      - src/gametest/**
      - src/main/java/com/caszgamermd/golemsplus/**
      - training/**
      - .github/workflows/builder-physical-timetrial-probe.yml
  workflow_dispatch:

jobs:
  real-minecraft-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify 10 physical BuilderGolem entrants and registration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('src/gametest/resources/fabric.mod.json').read_text())
          required='com.caszgamermd.golemsplus.builder.BuilderEvolutionTimeTrialGameTest'
          assert required in manifest['entrypoints']['fabric-gametest'], (
              'The REAL-ENTITY GameTest is mandatory, not an optional probe')
          test=Path('src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderEvolutionTimeTrialGameTest.java').read_text()
          assert 'new BuilderGolem(' in test
          assert 'private static final int DEADLINE=360;' in test
          assert 'SELECTED_BOTS.length!=10' in test
          assert '0,2,4,6,8,11,13,15,17,19' in test
          assert 'if(finished==bots.size())helper.succeed();' in test
          assert 'else helper.fail(' in test
          print('Physical-only acceptance gate: 10 live BuilderGolem entities / 360 ticks')
          PY
      - name: Mandatory 360-tick real Minecraft golem trial
        run: gradle --no-daemon runGameTest
      - name: Preserve movement collision and timeout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-18-second-physical-entity-diagnostics
          path: |
            build/gametest/
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 30
