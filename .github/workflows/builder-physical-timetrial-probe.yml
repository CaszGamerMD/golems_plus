name: Physical Timetrial Probe (20 actual Builder Golems)

on:
  workflow_dispatch:

jobs:
  real-minecraft-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Enable opt-in actual collision trial in temporary GameTest manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          file=Path("src/gametest/resources/fabric.mod.json")
          data=json.loads(file.read_text())
          entry="com.caszgamermd.golemsplus.builder.BuilderEvolutionTimeTrialGameTest"
          game=data["entrypoints"]["fabric-gametest"]
          if entry not in game: game.append(entry)
          file.write_text(json.dumps(data,indent=2)+"\n")
          PY
      - name: Spawn 20 real golems, race 400 ticks, then remove all
        run: gradle --no-daemon runGameTest
      - name: Preserve the test result, including failed collision trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-timetrial-physical-failure-diagnostics
          path: |
            build/gametest/
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 30
