name: Required - 10 actual Builder Golems in Minecraft (18s)

on:
  push:
    branches:
      - feature/builder-evolutionary-navigation-trainer-262
  workflow_dispatch:

permissions:
  contents: write

# Serialize checkpoint writers so one Minecraft run cannot overwrite
# another run's genetically learned progress.
concurrency:
  group: physical-evolution-checkpoint-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  real-minecraft-physics:
    runs-on: ubuntu-latest
    env:
      TRAINING_BRANCH: ${{ github.head_ref || github.ref_name }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Test gene persistence and no-regression champion merging
        run: |
          python3 -m unittest discover -s scripts/tests -p test_merge_real_evolution_state.py -v
          python3 -m unittest discover -s scripts/tests -p test_export_real_evolution_replays.py -v
      - name: Isolate the real-entity training course from other GameTest arenas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          manifest=json.loads(p.read_text())
          required='com.caszgamermd.golemsplus.builder.BuilderEvolutionTimeTrialGameTest'
          # Dedicated world: this one job runs the actual course alone.
          # The standard build independently runs the normal regression
          # GameTests. Every scored evolution still uses live entities.
          manifest['entrypoints']['fabric-gametest']=[required]
          p.write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Verify 10 physical BuilderGolem entrants and registration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('src/gametest/resources/fabric.mod.json').read_text())
          required='com.caszgamermd.golemsplus.builder.BuilderEvolutionTimeTrialGameTest'
          assert manifest['entrypoints']['fabric-gametest'] == [required], (
              'A physical evolution run must own an isolated Minecraft GameTest arena')
          test=Path('src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderEvolutionTimeTrialGameTest.java').read_text()
          assert 'new BuilderGolem(' in test
          assert 'private static final int DEADLINE=360;' in test
          assert 'SELECTED_BOTS.length!=10' in test
          assert '0,2,4,6,8,11,13,15,17,19' in test
          assert 'if(finished==bots.size()){' in test
          assert 'helper.succeed();return;' in test
          assert 'Physical evolution failed after ' in test
          assert 'Genome.cross(a,b,rng).mutate(rng)' in test
          assert 'spawnGeneration(helper,generationGenes,collisionMemory)' in test
          assert 'realBlockFailures' in test
          assert 'planRoute(' in test
          assert 'walkOneTick(helper,b)' in test
          print('Physical evolution gate: 10 live BuilderGolem entities per 360-tick generation, genetics from actual collisions')
          PY
      - name: Mandatory 360-tick real Minecraft golem trial
        shell: bash
        env:
          GOLEMS_EVOLUTION_STATE_DIR: ${{ github.workspace }}/training/state
          GOLEMS_EVOLUTION_REPLAY_DIR: ${{ github.workspace }}/training/replays/live
        run: |
          set -o pipefail
          mkdir -p build/timetrial-training training/replays/live
          failures=0
          for trial in 1 2 3; do
            echo "::group::Real physical Minecraft trial ${trial}/3"
            export GOLEMS_EVOLUTION_SESSION="${GITHUB_RUN_ID:-local}-${trial}"
            echo "Trial ${trial}: resuming persisted DNA from previous trial"
            if gradle --no-daemon runGameTest 2>&1 | tee "build/timetrial-training/real-builder-trial-${trial}.log"; then
              echo "PHYSICAL TRIAL ${trial}: Minecraft GameTest passed"
            else
              echo "PHYSICAL TRIAL ${trial}: Minecraft GameTest failed; keeping learned DNA"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          echo "Completed 3 physical trials; failures=${failures}"
          exit "${failures}"
      - name: Generate offline HTML with every physical generation
        if: always()
        run: python3 scripts/export_real_evolution_replays.py --session-prefix "" --viewer training/replays/route-viewer.html
      - name: Commit learned real-entity genes, EVEN IF the trial fails
        if: always() && (github.head_ref == 'feature/builder-evolutionary-navigation-trainer-262' || github.ref == 'refs/heads/feature/builder-evolutionary-navigation-trainer-262') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          if [[ ! -s training/state/checkpoint.json ]]; then
            echo 'No new real-entity checkpoint was produced.'
            exit 0
          fi
          git config user.name 'golems-evolution[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Protect new genetic improvements from stale CI checkouts:
          # merge results with LATEST remote champion/state before commit.
          local_state="$(mktemp -d)"
          cp -a training/state/. "$local_state/"
          replay_backup="$(mktemp -d)"
          if [[ -d training/replays/live ]]; then
            cp -a training/replays/live/. "$replay_backup/"
          fi
          viewer_backup="$(mktemp)"
          cp training/replays/route-viewer.html "$viewer_backup"
          # The GameTest workflow temporarily edits its Fabric test
          # manifest, and training edits tracked checkpoint files.
          # Reset this disposable checkout AFTER copying new learning.
          rm -rf training/state
          git reset --hard HEAD
          for attempt in 1 2 3; do
            git fetch origin "${TRAINING_BRANCH}"
            git checkout -B physical-training-publish "origin/${TRAINING_BRANCH}"
            python3 scripts/merge_real_evolution_state.py "$local_state" training/state
            mkdir -p training/replays/live
            cp -an "$replay_backup/." training/replays/live/
            cp "$viewer_backup" training/replays/route-viewer.html
            # Rebuild using BOTH locally captured and remotely published
            # generations. CI runs must not hide older test routes.
            python3 scripts/export_real_evolution_replays.py --session-prefix "" --viewer training/replays/route-viewer.html
            git add -- training/state/ training/replays/live/ training/replays/route-viewer.html
            if git diff --cached --quiet; then
              echo 'No improved state over current remote.'
              exit 0
            fi
            git commit -m 'Preserve real Builder Golem mutations and best 10-of-10 champion [skip ci]'
            if git push origin HEAD:"${TRAINING_BRANCH}"; then
              echo 'Checkpoint, champion, and history are durable on GitHub.'
              exit 0
            fi
            echo "Remote updated concurrently; remerging fresh state (attempt $attempt)"
          done
          echo 'Failed to save learned state: refusing to claim persistence.'
          exit 1
      - name: Preserve movement collision and timeout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-18-second-physical-entity-diagnostics
          path: |
            training/state/
            build/timetrial-training/real-builder-trial-*.log
            training/replays/live/
            build/gametest/
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 30
