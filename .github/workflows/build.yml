name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - run: gradle --no-daemon clean test build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: golems-plus-dev
          path: build/libs/*.jar
          if-no-files-found: error
