name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Frozen playable snapshot: compile, unit-test and remap the Fabric mod.
  # This job is independent of the still-failing full Dome GameTest.
  # It must NOT be represented as a completed 3537-block Dome build.
  snapshot:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'snapshot/rail-visuals-detour-fix-262' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Compile, run unit tests, and build playable remapped JAR
        run: gradle --no-daemon clean test assemble
      - name: Check actual Fabric classes and freeze one playable JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [ "${#candidates[@]}" -ne 1 ]; then
            printf 'Expected exactly one playable Fabric JAR; found %s\n' "${#candidates[@]}"
            printf '%s\n' "${candidates[@]}"
            exit 1
          fi
          zipinfo -1 "${candidates[0]}" > "$RUNNER_TEMP/jar-content.txt"
          for file in fabric.mod.json com/caszgamermd/golemsplus/crane/BuildingCrane.class com/caszgamermd/golemsplus/worker/WorkerNavigation.class com/caszgamermd/golemsplus/builder/BuilderScaffolding.class; do
            grep -Fxq "$file" "$RUNNER_TEMP/jar-content.txt" || { echo "Missing $file"; exit 1; }
          done
          mkdir -p snapshot
          cp "${candidates[0]}" snapshot/golems-plus-rail-visuals-detour-fix-26.2.jar
          sha256sum snapshot/*.jar | tee snapshot/SHA256SUMS.txt
      - name: Upload downloadable combined test JAR
        uses: actions/upload-artifact@v4
        with:
          name: golems-plus-rail-visuals-detour-fix-26.2
          path: snapshot/
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct-download snapshot prerelease
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="rail-visuals-detour-fix-26.2"
          file="snapshot/golems-plus-rail-visuals-detour-fix-26.2.jar"
          cat > "$RUNNER_TEMP/snapshot-notes.md" <<'EOF'
          Experimental Minecraft Fabric 26.2 snapshot fixing crane rail model branches to reflect actual neighbor connectivity, correct north/south and east/west wall face mounting, and repeated Builder A* detour loops.
          
          Includes physical one-block stepping, shared scaffold climb / solid landing / descent,
          two-block-outside Dome towers, and working four-Builder crane passenger movement.
          Compiled with Java 25, JUnit tested and Fabric-remapped.
          
          IMPORTANT: The full 3537-block Dome construction is still INCOMPLETE.
          This is not a production-stable or fully Dome-verified release. Keep the prior crane-connections-26.2 JAR as rollback.
          Install in a backed-up world, removing any old Golems Plus mod JAR first.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/snapshot-notes.md" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$file" --repo "$GITHUB_REPOSITORY" \
              --target "${{ github.event.pull_request.head.sha }}" --prerelease \
              --title "Crane rail visuals and Builder anti-detour loops (Fabric 26.2) — testing" \
              --notes-file "$RUNNER_TEMP/snapshot-notes.md"
          fi
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Publish stable downloads after successful main builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify per-job Ignore Crops/Plants keeps site clearing enabled
        run: python3 scripts/builder_ignore_plants_smoke.py
      - name: Verify Builders vacate placement cells safely
        run: python3 scripts/builder_placement_space_smoke.py
      - name: Verify Builder warehouse isolation and in-game diagnostics
        run: python3 scripts/builder_stall_diagnostics_smoke.py
      - name: Verify independent Builder zone execution and staggered scheduling
        run: python3 scripts/builder_independent_execution_smoke.py
      - name: Verify Builder zoned scheduling and reconciled warehouse stock
        run: python3 scripts/builder_zoned_workflow_smoke.py
      - name: Validate ten-coordinate Builder orders and whole-job warehouse supply
        run: python3 scripts/builder_ten_step_workflow_smoke.py
      - name: Verify Builder support deferral and connected-block safety
        run: python3 scripts/builder_support_dependency_smoke.py
      - name: Verify Builder worker-carried material sharing and stable supply paths
        run: python3 scripts/builder_crew_materials_smoke.py
      - name: Verify Builder keeps approaching when next block is still out of reach
        run: python3 scripts/builder_work_reach_smoke.py
      - name: Verify flat-site Builder route recovery and existing platform access
        run: python3 scripts/builder_navigation_recovery_smoke.py
      - name: Verify builder fence gate, elevated target and shulker recovery
        run: python3 scripts/builder_gate_scaffold_shulker_smoke.py
      - name: Verify active Builder scaffold descent and door deadlock recovery
        run: python3 scripts/builder_scaffold_door_recovery_smoke.py
      - name: Verify doorway clearance and complete scaffold up/down movement
        run: python3 scripts/builder_scaffold_door_exit_smoke.py
      - name: Verify 0.65 worker collision, return-to-scaffold and safe exit
        run: python3 scripts/builder_scaffold_return_065_smoke.py
      - name: Verify unlimited staged scaffold towers and exclusive movement
        run: python3 scripts/builder_scaffold_vertical_v2_smoke.py
      - name: Verify continuous Builder scaffold ascent and descent
        run: python3 scripts/builder_scaffold_continuous_smoke.py
      - name: Verify per-door FIFO traffic and scaffold gravity recovery
        run: python3 scripts/worker_door_traffic_smoke.py
      - name: Validate worker stair and slab navigation geometry
        run: python3 scripts/worker_stair_slab_navigation_smoke.py
      - name: Check parallel clearing, door placement and outstanding warehouse orders
        run: python3 scripts/builder_parallel_clearing_door_order_smoke.py
      - name: Check Builder clearing and courier recovery
        run: python3 scripts/builder_clear_courier_recovery_smoke.py
      - name: Verify snow clearing, full Builder orders and safe recycling
        run: python3 scripts/builder_snow_delivery_recycling_smoke.py
      - name: Verify Builder workforce and OnSite logistics cleanup
        run: python3 scripts/builder_job_cleanup_smoke.py
      - name: Verify warehouse pending order and courier deferral
        run: python3 scripts/builder_warehouse_queued_smoke.py
      - name: Verify Builder chunk ticket and worker persistence protections
        run: python3 scripts/builder_chunk_tickets_smoke.py
      # Check deterministic route/tower geometry even if the larger Dome
      # server trial later stalls on crew traffic. Never treat this as
      # a substitute for real-entity Minecraft GameTests.
      - name: Run Builder navigation and two-block tower clearance JUnit tests
        run: gradle --no-daemon test
      # The build task now runs a real dedicated Minecraft GameTest.
      # A green JUnit run alone does not count as a movement pass.
      - name: Run Minecraft server GameTests (scaffold route and framed doorway)
        id: minecraft
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon runGameTest 2>&1 | tee "$RUNNER_TEMP/builder-gametest.log"
      # An unfinished full Dome test remains RED. Nevertheless, once the
      # server proves 1,700 real world-state matches and four living Builders,
      # publish a separately labeled experimental JAR for hands-on trials.
      # Never replace the main/dev-latest release with a partial build.
      - name: Build experimental 1700-block checkpoint JAR
        if: ${{ failure() && steps.minecraft.conclusion == 'failure' }}
        id: dome_1700
        shell: bash
        run: |
          if ! grep -Fq '[DOME TEAMWORK] PASS 1700 placed-block' "$RUNNER_TEMP/builder-gametest.log"; then
            echo "reached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Dome checkpoint verified in the actual Minecraft server."
          gradle --no-daemon build -x runGameTest
          echo "reached=true" >> "$GITHUB_OUTPUT"
      - name: Upload experimental crane and navigation 1700 JAR
        if: ${{ steps.dome_1700.outputs.reached == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: golems-plus-crane-nav-1700-experimental
          path: |
            build/libs/*.jar
          if-no-files-found: error
      - name: Preserve Minecraft GameTest logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-scaffold-ring-gametest
          path: |
            build/gametest/
            build/reports/
            build/test-results/
            ${{ runner.temp }}/builder-gametest.log
          if-no-files-found: ignore
      - run: gradle --no-daemon clean test build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: golems-plus-dev
          path: build/libs/*.jar
          if-no-files-found: error
      # Unlike Actions artifacts, release attachments have stable download
      # URLs and don't expire with GitHub's artifact retention window.
      - name: Publish stable JAR and mods-folder ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one playable JAR, got %s\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          mkdir -p "$RUNNER_TEMP/mods"
          cp "${jars[0]}" "$RUNNER_TEMP/golems-plus-latest.jar"
          cp "${jars[0]}" "$RUNNER_TEMP/mods/golems-plus-latest.jar"
          (cd "$RUNNER_TEMP" && zip -q -r golems-plus-latest-mods.zip mods)
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Golems Plus ${version} for Minecraft Fabric 26.2.

          Built and tested automatically from commit ${GITHUB_SHA}.

          Direct JAR: golems-plus-latest.jar
          ZIP backup: golems-plus-latest-mods.zip (contains a mods/ folder)

          Remove any older Golems Plus JARs before installing.
          EOF
          if gh release view dev-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload dev-latest \
              "$RUNNER_TEMP/golems-plus-latest.jar" \
              "$RUNNER_TEMP/golems-plus-latest-mods.zip" \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit dev-latest --repo "$GITHUB_REPOSITORY" \
              --title "Golems Plus ${version} — latest development build" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create dev-latest \
              "$RUNNER_TEMP/golems-plus-latest.jar" \
              "$RUNNER_TEMP/golems-plus-latest-mods.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Golems Plus ${version} — latest development build" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
