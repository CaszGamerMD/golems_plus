name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Publish stable downloads after successful main builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      # Legacy source-text smoke checks referred to retired 32-cell stages
      # and old navigation method signatures. Use the checks already run
      # against the current Builder implementation, then compile and run
      # the physical Minecraft GameTests before publishing any JAR.
      - name: Validate inventory picker geometry and read-only slot clicks
        run: python3 scripts/builder_inventory_picker_smoke.py
      - name: Validate bounded lookahead and next-tick handoff
        run: python3 scripts/builder_continuous_work_smoke.py
      - name: Verify roof evacuation guards and prioritization
        run: python3 scripts/builder_finished_roof_evacuation_smoke.py
      - name: Validate main's existing Builder smoke tests
        run: |
          python3 scripts/builder_independent_execution_smoke.py
          python3 scripts/builder_placement_space_smoke.py
          python3 scripts/builder_zoned_workflow_smoke.py
      - name: Compile and run unit tests
        run: gradle --no-daemon clean test jar compileGametestJava
      - name: Run exact full VillagerMatrixClean_V2 physical construction
        shell: bash
        run: |
          # Require the ORIGINAL 15,376-block November 8 Matrix schematic.
          # The prior 27-cell foundation was a smoke test, not full coverage.
          # Full Matrix completion blocks the patched JAR release.
          # The Dome stays a separate diagnostic regression.
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          path = Path('src/gametest/resources/fabric.mod.json')
          data = json.loads(path.read_text())
          data['entrypoints']['fabric-gametest'] = [
              'com.caszgamermd.golemsplus.builder.BuilderVillagerMatrixFullGameTest'
          ]
          path.write_text(json.dumps(data, indent=2) + '\n')
          PYTEST
          set -euo pipefail
          mkdir -p build/matrix-traces
          # Initially require ONE complete end-to-end construction, not
          # repeatability of a starter foundation. Separate Matrix CI
          # monitors the same full schematic and reports exact failures.
          for attempt in 1; do
            log="build/matrix-traces/release-run-${attempt}.log"
            gradle --no-daemon runGameTest 2>&1 | tee "$log"
            grep -E '\[MATRIX FULL (IMPORT|UNSUPPORTED|START|PROGRESS|STALL|PASS)' "$log" || true
            grep -Fq '[MATRIX FULL PASS] 15376/15376' "$log"
          done
      - name: Preserve Minecraft GameTest logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-scaffold-ring-gametest
          path: |
            build/gametest/
            build/reports/
            build/test-results/
            build/matrix-traces/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: golems-plus-dev
          path: build/libs/*.jar
          if-no-files-found: error
      # Unlike Actions artifacts, release attachments have stable download
      # URLs and don't expire with GitHub's artifact retention window.
      - name: Publish stable JAR and mods-folder ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one playable JAR, got %s\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          mkdir -p "$RUNNER_TEMP/mods"
          cp "${jars[0]}" "$RUNNER_TEMP/golems-plus-latest.jar"
          cp "${jars[0]}" "$RUNNER_TEMP/mods/golems-plus-latest.jar"
          (cd "$RUNNER_TEMP" && zip -q -r golems-plus-latest-mods.zip mods)
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Golems Plus ${version} for Minecraft Fabric 26.2.

          Built and tested automatically from commit ${GITHUB_SHA}.

          Direct JAR: golems-plus-latest.jar
          ZIP backup: golems-plus-latest-mods.zip (contains a mods/ folder)

          Remove any older Golems Plus JARs before installing.
          EOF
          if gh release view dev-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload dev-latest \
              "$RUNNER_TEMP/golems-plus-latest.jar" \
              "$RUNNER_TEMP/golems-plus-latest-mods.zip" \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit dev-latest --repo "$GITHUB_REPOSITORY" \
              --title "Golems Plus ${version} — latest development build" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create dev-latest \
              "$RUNNER_TEMP/golems-plus-latest.jar" \
              "$RUNNER_TEMP/golems-plus-latest-mods.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Golems Plus ${version} — latest development build" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
