name: Dome Autotune — Physical Golem Navigation
run-name: "Dome autotune: up to five physical GameTests"
on:
  schedule:
    # GitHub cron executes on the DEFAULT branch only; not ChatGPT Work.
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Bootstrap a first training run when this scheduler is installed.
      - '.github/workflows/dome-autotune-scheduled.yml'

permissions:
  contents: write  # Save experiment scores ONLY on isolated training branch.

concurrency:
  group: golems-plus-physical-dome-autotune
  cancel-in-progress: false

jobs:
  tune-dome:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out dome experiment, not production main
        uses: actions/checkout@v4
        with:
          ref: test/dome-frontier-planner-262
          fetch-depth: 1
          persist-credentials: true
      - name: Java 25 for Minecraft Fabric 26.2
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle 9.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify autotune parser, scoring and replay protection
        run: python3 -m unittest discover -s scripts -p 'test_dome_autotune.py' -v
      - name: Run multiple real dome tests and keep best validated settings
        run: python3 scripts/dome_autotune.py --cycles 5 --max-minutes 42
      - name: Preserve every physical test and candidate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dome-autotune-diagnostics
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/dome-autotune/
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
