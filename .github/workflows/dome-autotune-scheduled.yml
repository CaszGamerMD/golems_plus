# Retired 2026-11-16 at the repository owner's request.
# Keep the filename as a harmless manual-only endpoint so an old running
# session's self-dispatch cannot restart training. Historical implementation
# is preserved in Git history; training scripts and results are unchanged.
name: Dome Autotune — Stopped
on:
  workflow_dispatch:
    inputs:
      heartbeat_probe:
        description: "Legacy input; no training is performed"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  stopped:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Dome autotune retired. No tests, state writes, cooldown, or continuation dispatch."
