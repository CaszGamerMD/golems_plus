name: Dome Autotune — Physical Golem Navigation
run-name: "Dome autotune: up to five physical GameTests"
on:
  schedule:
    # GitHub schedules are best-effort. Check four times an hour, but the
    # lightweight due gate permits one substantial session per ~hour.
    # Offset from minute 0 to avoid GitHub's busiest scheduling boundary.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Resync GitHub's scheduler and bootstrap a run when edited.
      - '.github/workflows/dome-autotune-scheduled.yml'

permissions:
  contents: write  # Save scores ONLY on the isolated training state branch.

concurrency:
  group: golems-plus-physical-dome-autotune
  cancel-in-progress: false

jobs:
  check-due:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      due: ${{ steps.gate.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Gate scheduled runs using persisted last successful training session
        id: gate
        shell: bash
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Manual requests and workflow edits always execute once.
          if [[ "$TRIGGER" != "schedule" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Explicit bootstrap/manual trigger: training due."
            exit 0
          fi
          # A missing/unreadable state must not permanently stop training.
          if ! git fetch -q --no-tags origin refs/heads/training/dome-autotune-state-262; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "No prior state; training due."
            exit 0
          fi
          if ! git show FETCH_HEAD:dome-training/state.json > "$RUNNER_TEMP/dome-training-state.json"; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "No readable prior session; training due."
            exit 0
          fi
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          try:
              saved = json.loads(
                  (Path(os.environ["RUNNER_TEMP"]) / "dome-training-state.json").read_text()
              )
              last = dt.datetime.fromisoformat(saved["last_session"])
              if last.tzinfo is None:
                  raise ValueError("missing timezone")
              age = (dt.datetime.now(dt.timezone.utc) - last).total_seconds()
              due = age >= 50 * 60 or age < 0
              print(f"Previous completed session: {round(age / 60, 1)} minutes ago. Due: {due}")
          except (KeyError, ValueError, TypeError, OSError) as exc:
              print(f"Cannot verify fresh session ({exc}); running instead.")
              due = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"due={str(due).lower()}\n")
          PY

  tune-dome:
    needs: check-due
    if: needs.check-due.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out dome experiment, not production main
        uses: actions/checkout@v4
        with:
          ref: test/dome-frontier-planner-262
          fetch-depth: 1
          persist-credentials: true
      - name: Java 25 for Minecraft Fabric 26.2
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle 9.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify autotune parser, scoring and replay protection
        run: python3 -m unittest discover -s scripts -p 'test_dome_autotune.py' -v
      - name: Run multiple real dome tests and keep best validated settings
        run: python3 scripts/dome_autotune.py --cycles 5 --max-minutes 42
      - name: Preserve every physical test and candidate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dome-autotune-diagnostics
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/dome-autotune/
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
