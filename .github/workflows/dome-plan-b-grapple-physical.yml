name: Plan B — Real Grapple Full Physical Dome
run-name: "3,537-block Dome / 4 real Builders / Grapple Hook only"
on:
  push:
    branches: [test/dome-plan-b-grapple-262]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grapple-dome:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Assert original physical dome and grapple-only builder navigation
        run: |
          test -f src/gametest/resources/golems_plus_dome/segment0.txt
          grep -q 'BuilderGrappleAccess.reach' src/main/java/com/caszgamermd/golemsplus/builder/BuilderBuildService.java
          ! grep -q 'BuilderScaffoldPlanA.reach' src/main/java/com/caszgamermd/golemsplus/builder/BuilderBuildService.java
          grep -q 'needs.add(WorksiteContent.GRAPPLE_HOOK)' src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderDomeConstructionGameTest.java
      - name: Run physical 3537-block dome with four Grapple Builders
        run: gradle --no-daemon runGameTest
      - name: Save complete dome reports and world diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-b-grapple-full-dome-evidence
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
