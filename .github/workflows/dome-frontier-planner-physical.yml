      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Select focused tests in a separate physical world
        run: |
          python - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          d=json.loads(p.read_text())
          d['entrypoints']['fabric-gametest']=['com.caszgamermd.golemsplus.builder.BuilderDomeApproachGameTest']
          p.write_text(json.dumps(d,indent=2)+'\n')
          PYTEST
      - name: Compile and run unit and focused physical regressions
        run: gradle --no-daemon runGameTest
      - name: Save focused physical reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-courtyard-physical-diagnostics
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
  courtyard-low:
    runs-on: ubuntu-latest
    env:
      GOLEMS_COURTYARD_HEIGHT: '2'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
