name: Construction Frontier — Full Physical Dome
run-name: "3,537 block dome / four physical Builder Golems / prevalidated frontier"
on:
  push:
    branches: [test/dome-frontier-planner-262, fix/dome-final-access-262, experiment/builder-roof-handoff-retry-262, experiment/builder-on-build-scaffolding-262, experiment/builder-fractional-freespace-262, experiment/builder-fractional-scaffold-262, experiment/builder-dome-success-control-262, experiment/builder-dome-starter-toolkit-262, feat/builder-rally-point-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dome:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify real original dome and frontier planner
        run: |
          test -f src/gametest/resources/data/golems_plus_gametest/gametest/structure/dome_arena.snbt
          grep -q 'BuilderConstructionPlanner.choose' src/main/java/com/caszgamermd/golemsplus/builder/BuilderBuildService.java
      - name: Run full 3537-block dome with four real Builder Golems
        run: gradle --no-daemon runGameTest
      - name: Render the ACTUAL stalled dome voxel map (even when test fails)
        if: always()
        run: python scripts/render_dome_route_model.py || true
      - name: Record stuck Builder snapshots and scaffold recovery events
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, re
          logs=Path('build/run/gameTest/logs')
          out=Path('build/run/gameTest/route-survey')
          out.mkdir(parents=True,exist_ok=True)
          sources=sorted(logs.rglob('*.log')) if logs.exists() else []
          lines=[]
          for source in sources:
              for line in source.read_text(errors='replace').splitlines():
                  if any(tag in line for tag in ('[DOME STUCK WORKER]', '[DOME STUCK REPORT]', '[DOME PROGRESS]', '[DOME COORD]', '[DOME REMAINING]', '[PLAN A RECOVERY]', '[PLAN A REPAIR]', '[LEGAL WORK POSE]')):
                      lines.append(f'{source}: {line}')
          (out/'stuck_golem_evidence.log').write_text('\n'.join(lines)+'\n')
          pattern=re.compile(r'\[DOME STUCK WORKER\] tick=(?P<tick>\d+) idleTicks=(?P<idle_ticks>\d+) worker=(?P<worker>.*?) feetXYZ=\((?P<feet_xyz>[^)]+)\) grounded=(?P<grounded>\w+) noGravity=(?P<no_gravity>\w+) claimedStep=(?P<claimed_step>-?\d+) targetXYZ=(?P<target_xyz>BlockPos\{[^}]+\}) ownedScaffolds=(?P<owned_scaffolds>\d+) scaffoldPlan=(?P<scaffold_plan>.*?) climb=(?P<climb>\w+) grapple=(?P<grapple>\w+) problem=')
          fields=['tick','idle_ticks','worker','feet_xyz','grounded','no_gravity','claimed_step','target_xyz','owned_scaffolds','scaffold_plan','climb','grapple','raw_log']
          rows=[]
          for line in lines:
              if '[DOME STUCK WORKER]' not in line: continue
              match=pattern.search(line)
              row={key:match.group(key) if match else '' for key in fields if key!='raw_log'}
              row['raw_log']=line
              rows.append(row)
          with (out/'stuck_golem_snapshots.csv').open('w',newline='') as handle:
              writer=csv.DictWriter(handle,fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          print(f'[STUCK REPORT] snapshots={len(rows)} recovery_events={sum("[PLAN A RECOVERY]" in line for line in lines)} sources={len(sources)} evidence_lines={len(lines)}')
          PY
      - name: Save physical dome reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-dome-physical-diagnostics
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
            build/run/gameTest/route-survey/
  plants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Select ignored-crop completion regressions
        run: |
          python - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          d=json.loads(p.read_text())
          d['entrypoints']['fabric-gametest']=[
            'com.caszgamermd.golemsplus.builder.BuilderIgnoredPlantProgressGameTest',
          ]
          p.write_text(json.dumps(d,indent=2)+'\n')
          PYTEST
      - name: Verify real Builder completion without crop placements
        run: gradle --no-daemon runGameTest
  roof-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Run original dome geometry and reachable-route survey
        run: |
          python - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          d=json.loads(p.read_text())
          d['entrypoints']['fabric-gametest']=[
            'com.caszgamermd.golemsplus.builder.BuilderDomeRouteSurveyGameTest',
          ]
          p.write_text(json.dumps(d,indent=2)+'\n')
          PYTEST
          gradle --no-daemon runGameTest
      - name: Render original model as interactive offline HTML
        if: always()
        run: python scripts/render_dome_route_model.py || true
      - name: Export accurate dome model and worker route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accurate-dome-roof-route-model
          if-no-files-found: warn
          path: |
            build/run/gameTest/route-survey/
            build/run/gameTest/logs/
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Select focused tests in a separate physical world
        run: |
          python - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          d=json.loads(p.read_text())
          d['entrypoints']['fabric-gametest']=[
              'com.caszgamermd.golemsplus.builder.BuilderGrappleWorkPoseGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderGrappleReturnGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderDoorwayGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderPlacementClearanceGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderPlaceOneBelowGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderConstructionFrontierGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderFenceStepGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderCornerRejoinGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderWorkAccessGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderStagedGrappleGameTest',
          ]
          p.write_text(json.dumps(d,indent=2)+'\n')
          PYTEST
      - name: Compile and run unit and focused physical regressions
        run: gradle --no-daemon test runGameTest
      - name: Save focused physical reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-focused-physical-diagnostics
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
  courtyard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
