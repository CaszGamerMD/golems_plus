name: Construction Frontier — Full Physical Dome
run-name: "3,537 block dome / four physical Builder Golems / prevalidated frontier"
on:
  push:
    branches: [test/dome-frontier-planner-262]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dome:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify real original dome and frontier planner
        run: |
          test -f src/gametest/resources/data/golems_plus_gametest/gametest/structure/dome_arena.snbt
          grep -q 'BuilderConstructionPlanner.choose' src/main/java/com/caszgamermd/golemsplus/builder/BuilderBuildService.java
      - name: Run full 3537-block dome with four real Builder Golems
        run: gradle --no-daemon runGameTest
      - name: Save physical dome reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-dome-physical-diagnostics
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Select focused tests in a separate physical world
        run: |
          python - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          d=json.loads(p.read_text())
          d['entrypoints']['fabric-gametest']=[
              'com.caszgamermd.golemsplus.builder.BuilderGrappleWorkPoseGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderGrappleReturnGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderDoorwayGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderPlacementClearanceGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderConstructionFrontierGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderFenceStepGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderCornerRejoinGameTest',
              'com.caszgamermd.golemsplus.builder.BuilderStagedGrappleGameTest',
          ]
          p.write_text(json.dumps(d,indent=2)+'\n')
          PYTEST
      - name: Compile and run unit and focused physical regressions
        run: gradle --no-daemon test runGameTest
      - name: Save focused physical reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-focused-physical-diagnostics
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/test-results/
            build/reports/
            build/run/gameTest/logs/
