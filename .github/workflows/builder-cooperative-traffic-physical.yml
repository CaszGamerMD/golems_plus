name: Builder cooperative navigation - physical traffic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/builder-cooperative-traffic-physical.yml'
      - 'src/main/java/com/caszgamermd/golemsplus/worker/WorkerNavigation.java'
      - 'src/main/java/com/caszgamermd/golemsplus/worker/WorkerTrafficForecast.java'
      - 'src/main/java/com/caszgamermd/golemsplus/worker/WorkerRoutePlanner.java'
      - 'src/gametest/java/com/caszgamermd/golemsplus/builder/BuilderCooperativeTrafficGameTest.java'
      - 'src/test/java/com/caszgamermd/golemsplus/worker/WorkerTrafficForecastTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opposing-builders:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Test finite traffic horizon and valid narrow corridors
        run: gradle --no-daemon test --tests 'com.caszgamermd.golemsplus.worker.WorkerTrafficForecastTest'
      - name: Run only physical opposing Builder traffic
        shell: bash
        run: |
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
              'com.caszgamermd.golemsplus.builder.BuilderCooperativeTrafficGameTest'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PYTEST
          set -o pipefail
          gradle --no-daemon runGameTest 2>&1 | tee "$RUNNER_TEMP/cooperative-traffic.log"
          if ! grep -Fq '[COOPERATIVE TRAFFIC PASS] 2/2' "$RUNNER_TEMP/cooperative-traffic.log"; then
            echo '::error::Two real Builders failed to exchange positions without deadlock.'
            exit 1
          fi
      - name: Save cooperative route diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cooperative-traffic-trace
          if-no-files-found: ignore
          path: |
            build/gametest/
            build/reports/
            build/test-results/
            build/run/gameTest/logs/
